name: Package JavaFX App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-deb:
    name: Build DEB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot dpkg-dev

      - name: Build project
        run: mvn -B clean package

      - name: Create app image
        run: mvn -B javafx:jlink

      - name: Package DEB
        run: |
          APP_NAME="music-editor-client"
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" = "$GITHUB_REF_NAME" ]; then VERSION="1.0.0"; fi

          rm -rf dist
          mkdir -p dist/deb/DEBIAN
          mkdir -p dist/deb/opt/$APP_NAME
          mkdir -p dist/deb/usr/bin

          # Copia la imagen generada por javafx:jlink
          cp -r target/app/* dist/deb/opt/$APP_NAME/

          cat > dist/deb/DEBIAN/control <<EOF
          Package: $APP_NAME
          Version: $VERSION
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: Lukas Clifford
          Description: Music Editor Client written in JavaFX
          EOF

          cat > dist/deb/usr/bin/$APP_NAME <<'EOF'
          #!/bin/bash
          /opt/music-editor-client/bin/app "$@"
          EOF
          chmod +x dist/deb/usr/bin/$APP_NAME

          dpkg-deb --build dist/deb dist/music-editor-client.deb

      - name: Upload DEB artifact
        uses: actions/upload-artifact@v4
        with:
          name: music-editor-client-deb
          path: dist/music-editor-client.deb

  build-msi:
    name: Build MSI
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build project
        shell: pwsh
        run: mvn -B clean package

      - name: Create app image
        shell: pwsh
        run: mvn -B javafx:jlink

      - name: Package MSI
        shell: pwsh
        run: |
          $VERSION = $env:GITHUB_REF_NAME
          if ($VERSION.StartsWith("v")) { $VERSION = $VERSION.Substring(1) }
          if ([string]::IsNullOrWhiteSpace($VERSION)) { $VERSION = "1.0.0" }

          New-Item -ItemType Directory -Force dist | Out-Null

          jpackage `
            --type msi `
            --name "Music Editor Client" `
            --app-version $VERSION `
            --input target/app `
            --main-class app.musiceditorclient.Launcher `
            --main-jar Music-Editor-Client-1.0.0.jar `
            --dest dist `
            --win-console `
            --icon icon.png

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: music-editor-client-msi
          path: dist/*.msi
